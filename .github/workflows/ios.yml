name: iOS

# A probe, not the real workflow: it exists on a throwaway branch only. It repeats the one UI test that stalled on main
# (the Yours search step, after the keyboard comes up) on main's own code ("main") and on main without the tab-bar glyph
# walker from #22 ("noglyph"), so the failures of the two can be compared.
on:
  push:
    branches: ["claude/ios-main-probe"]

permissions:
  contents: read

concurrency:
  group: ios-probe-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  probe:
    name: Probe (${{ matrix.arm }} ${{ matrix.rep }})
    runs-on: macos-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arm: [main, noglyph]
        rep: [a, b, c]
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          xcodebuild -version

      - name: Keep Spotlight off the build
        run: sudo mdutil -a -i off || true

      - name: Install tools
        run: brew install xcodegen xcbeautify

      # The arm without the glyph walker: the host view and the swizzle are the whole of #22's runtime code.
      - name: Take the glyph walker out
        if: ${{ matrix.arm == 'noglyph' }}
        run: |
          sed -i '' '/\.background(TabGlyphQuietHost())/d' App/Features/Root/MainTabView.swift
          sed -i '' 's|^        TabSymbolQuiet\.install$|        // probe: the glyph walker is off|' App/Features/Root/TabBarStyle.swift
          git --no-pager diff --stat
          grep -n "TabGlyphQuietHost\|TabSymbolQuiet.install\|glyph walker is off" App/Features/Root/MainTabView.swift App/Features/Root/TabBarStyle.swift

      - name: Generate the project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          id=$(xcrun simctl list devices available iPhone -j | python3 scripts/pick_simulator.py)
          echo "Using simulator $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project HyperVault.xcodeproj -scheme HyperVault \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | xcbeautify --renderer github-actions

      # Eight launches of the same journey in one job; a failure in one does not stop the next.
      - name: The Yours journey, eight times
        id: uitests
        continue-on-error: true
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project HyperVault.xcodeproj -scheme HyperVault \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath build \
            -only-testing:HyperVaultUITests/TabsJourneyTests/testYoursListsFiltersSearchesAndPutsARowOnThePage \
            -test-iterations 8 \
            -test-repetition-relaunch-enabled YES \
            -parallel-testing-enabled NO \
            -resultBundlePath build/ui-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ui-test.log | xcbeautify --renderer github-actions

      - name: What each launch did
        if: ${{ !cancelled() }}
        run: |
          echo "arm=${{ matrix.arm }} rep=${{ matrix.rep }}"
          grep -hE "Test Case .*(passed|failed) \(" ui-test.log | sed -E 's/^.*(Test Case .*)$/\1/' | cut -c1-200
          grep -hE "error:|Timed out|Lost connection" ui-test.log | sort | uniq -c | head -20

      - name: Upload the result bundle
        if: ${{ !cancelled() && steps.uitests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: probe-results-${{ matrix.arm }}-${{ matrix.rep }}
          path: build/ui-tests.xcresult
          if-no-files-found: ignore
