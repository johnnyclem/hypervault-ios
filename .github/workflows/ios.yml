name: iOS

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: write

# A branch with an open PR triggers twice (push and pull_request); both resolve
# to the same group, so only the newest run survives.
concurrency:
  group: ios-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # The Kit is Foundation-only, so its tests run on Linux in seconds.
  kit:
    name: HyperVaultKit tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Test
        working-directory: Packages/HyperVaultKit
        run: swift test

  # The app, its extensions and its tests, on a simulator.
  app:
    name: App build and tests (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Pick the newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest/Contents/Developer"; fi
          xcodebuild -version
          swift --version

      - name: Install tools
        run: brew install xcodegen xcbeautify

      - name: Generate the project
        run: xcodegen generate

      - name: Pick a simulator
        id: sim
        run: |
          id=$(xcrun simctl list devices available iPhone -j | python3 scripts/pick_simulator.py)
          echo "Using simulator $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project HyperVault.xcodeproj -scheme HyperVault \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | xcbeautify --renderer github-actions

      # The journeys: the whole app, launched on the simulator and driven with taps and typing. The app is a
      # debug build whose network is canned inside it (App/Core/UITestHarness.swift); nothing here reaches a
      # real server. They run before the unit tests because they are the quick gate, and the unit tests below
      # run whether or not they pass.
      - name: UI tests
        id: uitests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project HyperVault.xcodeproj -scheme HyperVault \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath build \
            -only-testing:HyperVaultUITests \
            -parallel-testing-enabled NO \
            -resultBundlePath build/ui-tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee ui-test.log | xcbeautify --renderer github-actions

      # Every journey step attached a screenshot to the result; they are written out as PNGs next to the
      # unit tests' snapshots, so they are uploaded and published with them (the ui/ folder).
      - name: Export the UI test screenshots
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: python3 scripts/export_ui_screenshots.py build/ui-tests.xcresult build/snapshot-out/snapshots/ui

      - name: Upload the UI test results
        if: ${{ !cancelled() && steps.uitests.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: build/ui-tests.xcresult
          if-no-files-found: ignore

      - name: Test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          # xcodebuild hands TEST_RUNNER_* to the test process without the prefix.
          TEST_RUNNER_HV_SNAPSHOT_DIR: ${{ github.workspace }}/build/snapshot-out
        run: |
          set -o pipefail
          mkdir -p build/snapshot-out
          xcodebuild test-without-building \
            -project HyperVault.xcodeproj -scheme HyperVault \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -derivedDataPath build \
            -skip-testing:HyperVaultUITests \
            -resultBundlePath build/tests.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log | xcbeautify --renderer github-actions

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: build/snapshot-out/snapshots
          if-no-files-found: ignore

      # Screens rendered by the tests are pushed to a throwaway branch so they
      # can be looked at without a simulator: git fetch origin snapshots-<branch>.
      - name: Publish snapshots to a branch
        if: always()
        continue-on-error: true
        run: |
          if [ ! -d build/snapshot-out/snapshots ]; then echo "no snapshots"; exit 0; fi
          slug=$(echo "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" | tr '/' '-')
          dir=$(mktemp -d)
          cp -R build/snapshot-out/snapshots "$dir/"
          cd "$dir"
          git init -q
          git checkout -q -b "snapshots-$slug"
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "Snapshots for $GITHUB_SHA"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f -q origin "snapshots-$slug"

      - name: Summarise failures
        if: failure()
        run: |
          echo "---- errors ----"
          grep -hE "error:|\*\* (BUILD|TEST) FAILED|Test Case .* failed" build.log ui-test.log test.log 2>/dev/null | sort -u | head -80
          echo "---- failing tests ----"
          grep -hoE "Test Case '[^']+' failed" ui-test.log test.log 2>/dev/null | sort -u | head -80
          echo "---- UI test failures, as the result bundle records them ----"
          python3 scripts/summarize_xcresult.py build/ui-tests.xcresult || true
