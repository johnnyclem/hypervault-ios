name: HyperVault

# The Xcode project is generated from this file: `make project` (needs
# `brew install xcodegen`). Nothing is hand-edited in HyperVault.xcodeproj, and
# it is not committed.

options:
  bundleIdPrefix: store.hypervault
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_MODULE_VERIFIER: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    CLANG_ANALYZER_NONNULL: YES

packages:
  HyperVaultKit:
    path: Packages/HyperVaultKit

targets:
  HyperVault:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: HyperVaultKit
      - target: HyperVaultShare
      - target: HyperVaultWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HV_BUNDLE_PREFIX).app
        PRODUCT_NAME: HyperVault
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Config/Generated/App-Info.plist
      properties:
        CFBundleDisplayName: HyperVault
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: $(HV_BUNDLE_PREFIX).app
            CFBundleURLSchemes:
              - hypervault
        HVAppGroup: $(HV_APP_GROUP)
        HVKeychainGroup: $(AppIdentifierPrefix)$(HV_KEYCHAIN_GROUP)
        HVDefaultServer: $(HV_DEFAULT_SERVER)
        NSFaceIDUsageDescription: Lock HyperVault so only you can open it.
        NSMicrophoneUsageDescription: Dictate into the canvas and chat with your voice.
        NSSpeechRecognitionUsageDescription: Turn what you say into text, on your device where possible.
        NSCameraUsageDescription: Scan a page or a document to keep it.
        NSPhotoLibraryAddUsageDescription: Save images from your pages to Photos.
        NSUserActivityTypes:
          - store.hypervault.keep
          - store.hypervault.open
    entitlements:
      path: Config/Generated/App.entitlements
      properties:
        com.apple.security.application-groups:
          - $(HV_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(HV_KEYCHAIN_GROUP)
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.associated-domains:
          - applinks:hypervault.store

  HyperVaultShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
      - path: Shared
    dependencies:
      - package: HyperVaultKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HV_BUNDLE_PREFIX).app.share
        PRODUCT_NAME: HyperVaultShare
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    info:
      path: Config/Generated/Share-Info.plist
      properties:
        CFBundleDisplayName: Keep in HyperVault
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HVAppGroup: $(HV_APP_GROUP)
        HVKeychainGroup: $(AppIdentifierPrefix)$(HV_KEYCHAIN_GROUP)
        HVDefaultServer: $(HV_DEFAULT_SERVER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: Config/Generated/Share.entitlements
      properties:
        com.apple.security.application-groups:
          - $(HV_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(HV_KEYCHAIN_GROUP)

  HyperVaultWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetExtension
      - path: Shared
    dependencies:
      - package: HyperVaultKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HV_BUNDLE_PREFIX).app.widgets
        PRODUCT_NAME: HyperVaultWidgets
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
    info:
      path: Config/Generated/Widgets-Info.plist
      properties:
        CFBundleDisplayName: HyperVault
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HVAppGroup: $(HV_APP_GROUP)
        HVKeychainGroup: $(AppIdentifierPrefix)$(HV_KEYCHAIN_GROUP)
        HVDefaultServer: $(HV_DEFAULT_SERVER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Generated/Widgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(HV_APP_GROUP)
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(HV_KEYCHAIN_GROUP)

  HyperVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/AppTests
    dependencies:
      - target: HyperVault
      - package: HyperVaultKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HV_BUNDLE_PREFIX).app.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/HyperVault.app/HyperVault

schemes:
  HyperVault:
    build:
      targets:
        HyperVault: all
        HyperVaultTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - HyperVaultTests
    profile:
      config: Release
    archive:
      config: Release
